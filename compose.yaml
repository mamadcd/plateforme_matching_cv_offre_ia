services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matching}
      POSTGRES_USER: ${POSTGRES_USER:-matching}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matching}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-matching}:${POSTGRES_PASSWORD:-matching}@db:5432/${POSTGRES_DB:-matching}"
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-compose-only-secret-change-before-deploy-0123456789}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      CHROMA_PERSIST_DIR: /app/chroma_db_v2
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db_v2
      - model_cache:/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  model_cache:
